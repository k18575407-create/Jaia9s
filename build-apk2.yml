      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Signing key
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PW: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
          KS_KEYPW: ${{ secrets.KEY_PASSWORD }}
        run: |
          K="$RUNNER_TEMP/k"; mkdir -p "$K"
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$K/release.jks"; PW="$KS_PW"; AL="$KS_ALIAS"; KPW="$KS_KEYPW"
          else
            PW=$(openssl rand -hex 12); AL=codevault; KPW=$PW
            keytool -genkeypair -keystore "$K/release.jks" -storepass "$PW" -keypass "$PW" -alias codevault -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=CodeVault"
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=codevault\n' "$PW" "$PW" > "$K/keystore-info.txt"
            echo "GENERATED=1" >> "$GITHUB_ENV"
          fi
          { echo "KEYSTORE_FILE=$K/release.jks"; echo "KEYSTORE_PASSWORD=$PW"; echo "KEY_ALIAS=$AL"; echo "KEY_PASSWORD=$KPW"; } >> "$GITHUB_ENV"
      - name: Build release APK
        working-directory: android
        env:
          URL: ${{ inputs.backend_url }}
        run: gradle :app:assembleRelease --no-daemon -PBACKEND_URL="$URL" -PversionCode=${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: CodeVault-APK
          path: android/app/build/outputs/apk/release/*.apk
      - uses: actions/upload-artifact@v4
        if: env.GENERATED == '1'
        with:
          name: SAVE-signing-key
          path: ${{ runner.temp }}/k/*
